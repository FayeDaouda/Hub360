# HUB en production (ou pré-production) sur un serveur Hetzner — cf. README.md.
#   docker compose --env-file .env up -d --build
# Une seule configuration pour les deux : seuls .env (domaine, secrets) et le
# nom du projet compose changent.

# Journaux des conteneurs bornés (5 fichiers de 10 Mo par service) : le suivi
# des erreurs y écrit, le disque du serveur ne doit pas se remplir.
x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    <<: *journaux
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10

  backend:
    <<: *journaux
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      HUB_DOUBLE_FACTEUR: ${HUB_DOUBLE_FACTEUR:-}
      PORT: 3001
      FRONT_URL: https://${HUB_DOMAINE}
      CORS_ORIGINS: https://${HUB_DOMAINE}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_MARQUE: ${MAIL_MARQUE:-hub360°}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      HUB_DONNEES_DEMO: ${HUB_DONNEES_DEMO:-}
      # Suivi des erreurs (backend/src/monitoring) : destinataire des alertes,
      # et dossier des sauvegardes surveillé chaque matin.
      ALERTES_EMAIL: ${ALERTES_EMAIL:-}
      SAUVEGARDES_DOSSIER: /sauvegardes
    volumes:
      - ./sauvegardes:/sauvegardes:ro
    # Prêt quand l'API répond et que la base répond (/api/sante) ; les
    # migrations passent avant, d'où le délai de démarrage.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/sante').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    <<: *journaux
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNE_URL: http://backend:3001/api

  caddy:
    <<: *journaux
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
    environment:
      HUB_DOMAINE: ${HUB_DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Serveur de TEST uniquement : charge les données de démo (fictives), vide
  # et recrée la société de démo. Refusé si HUB_DONNEES_DEMO n'est pas
  # « autorise » dans .env (cf. prisma/garde-demo.ts).
  #   docker compose --profile demo run --rm demo
  demo:
    <<: *journaux
    profiles: ['demo']
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      HUB_DONNEES_DEMO: ${HUB_DONNEES_DEMO:-}
    command: ['sh', '-c', 'npx prisma migrate deploy && npx ts-node prisma/seed.ts']

  # Première installation réelle : socle (rôles, matrice, société, catalogue)
  # et compte du CIO, sans données de démo. Rejouable.
  #   docker compose --profile demarrage run --rm \
  #     -e HUB_CIO_EMAIL=… -e HUB_CIO_PRENOM=… -e HUB_CIO_NOM=… demarrage
  demarrage:
    <<: *journaux
    profiles: ['demarrage']
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
    command: ['sh', '-c', 'npx prisma migrate deploy && npx ts-node prisma/demarrage.ts']

  # Sauvegarde quotidienne de la base (02:30) : copie sur le serveur, sur la
  # Storage Box et, chiffrée, chez un second fournisseur ; conservation 7 / 4 /
  # 12 (sauvegarde.sh). Test de restauration chaque dimanche à 03:30.
  sauvegarde:
    <<: *journaux
    build:
      context: .
      dockerfile: sauvegarde.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Storage Box Hetzner : SFTP sur le port 23, clé SSH et empreinte du
      # serveur dans deploy/secrets/ (docs/mise-en-production.md).
      SAUVEGARDE_BOITE_HOTE: ${SAUVEGARDE_BOITE_HOTE:-}
      RCLONE_CONFIG_BOITE_TYPE: sftp
      RCLONE_CONFIG_BOITE_HOST: ${SAUVEGARDE_BOITE_HOTE:-}
      RCLONE_CONFIG_BOITE_USER: ${SAUVEGARDE_BOITE_UTILISATEUR:-}
      RCLONE_CONFIG_BOITE_PORT: '23'
      RCLONE_CONFIG_BOITE_KEY_FILE: /run/secrets/storagebox_ed25519
      RCLONE_CONFIG_BOITE_KNOWN_HOSTS_FILE: /run/secrets/storagebox_known_hosts
      RCLONE_CONFIG_BOITE_SHELL_TYPE: none
      # Second fournisseur (compatible S3) : copie chiffrée avec age pour la
      # clé publique SAUVEGARDE_CLE_PUBLIQUE.
      SAUVEGARDE_DISTANT_BUCKET: ${SAUVEGARDE_DISTANT_BUCKET:-}
      SAUVEGARDE_CLE_PUBLIQUE: ${SAUVEGARDE_CLE_PUBLIQUE:-}
      RCLONE_CONFIG_DISTANT_TYPE: s3
      RCLONE_CONFIG_DISTANT_PROVIDER: ${SAUVEGARDE_DISTANT_FOURNISSEUR:-Other}
      RCLONE_CONFIG_DISTANT_ENDPOINT: ${SAUVEGARDE_DISTANT_ENDPOINT:-}
      RCLONE_CONFIG_DISTANT_REGION: ${SAUVEGARDE_DISTANT_REGION:-}
      RCLONE_CONFIG_DISTANT_ACCESS_KEY_ID: ${SAUVEGARDE_DISTANT_ACCESS_KEY:-}
      RCLONE_CONFIG_DISTANT_SECRET_ACCESS_KEY: ${SAUVEGARDE_DISTANT_SECRET_KEY:-}
    volumes:
      - ./sauvegardes:/sauvegardes
      - ./secrets:/run/secrets:ro

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
