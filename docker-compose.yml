version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - '5432:5432'
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data

volumes:
  hub_postgres_data:
